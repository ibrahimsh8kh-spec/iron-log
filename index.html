<script>
// Diagnostic safety net: if anything below fails to load or throws while
// running, show the real error directly on the page (in place of a blank
// screen) so it can be read/screenshotted without needing dev tools.
(function() {
  function showError(title, detail) {
    var el = document.getElementById("root");
    if (!el) return;
    el.innerHTML =
      '<div style="color:#F1EEE7;background:#121417;min-height:100vh;padding:20px;' +
      'font-family:-apple-system,monospace;font-size:13px;line-height:1.6;' +
      'white-space:pre-wrap;box-sizing:border-box;">' +
      '<div style="color:#D9A63D;font-weight:700;font-size:15px;margin-bottom:10px;">' + title + '</div>' +
      (detail || '') +
      '<div style="margin-top:18px;color:#9CA3AF;">Screenshot this screen and send it back — ' +
      'it says exactly what broke.</div></div>';
  }
  window.addEventListener('error', function(e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      showError('A required file failed to load', String(e.target.src || 'unknown file'));
    } else {
      showError('Iron Log hit an error', (e.message || 'Unknown error') +
        (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
    }
  }, true);
})();
</script>
